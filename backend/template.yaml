AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hitchin Treasure Hunt backend (HTTP API, Lambdas, Cognito, DynamoDB, assets bucket)

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
  AllowedOrigin:
    Type: String
    Default: ''
    Description: Frontend CloudFront URL for CORS (set after the first frontend deploy)

Conditions:
  IsDev: !Equals [!Ref Env, dev]
  HasAllowedOrigin: !Not [!Equals [!Ref AllowedOrigin, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Handler: index.handler
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        ENV: !Ref Env
        NODE_OPTIONS: --enable-source-maps
        GAME_TABLE: !Ref GameTable
        CONTENT_TABLE: !Ref ContentTable
        ASSETS_BUCKET: !Ref AssetsBucket
        USER_POOL_ID: !Ref UserPool
        POWERTOOLS_SERVICE_NAME: treasurehunt

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]
      # SAM drops the rest of CorsConfiguration if AllowOrigins is an !If, so each branch
      # carries the full config.
      CorsConfiguration: !If
        - IsDev
        - AllowOrigins: !If
            - HasAllowedOrigin
            - [!Ref AllowedOrigin, 'http://localhost:5173']
            - ['http://localhost:5173']
          AllowMethods: [GET, POST, OPTIONS]
          AllowHeaders: [authorization, content-type]
          MaxAge: 600
        - AllowOrigins: [!Ref AllowedOrigin]
          AllowMethods: [GET, POST, OPTIONS]
          AllowHeaders: [authorization, content-type]
          MaxAge: 600

  # Teams are created by the register Lambda (no self sign-up); the GM by scripts/create-gm.ts.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub treasurehunt-${Env}
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      # Light policy for a fun event; keep in step with passwordSchema in shared/src/team.ts.
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      MfaConfiguration: 'OFF'

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  GamemasterGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: gamemaster
      Description: Game master (admin console)

  # Game content, loaded by `npm run seed`; read-only to the game Lambdas (docs/04-data-model.md).
  ContentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # Game state: game, team profiles, stages, attempts. GSI1 is the sparse pending-review queue.
  GameTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # Private bucket for content images (content/) and team photos (teams/), via pre-signed URLs only.
  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, POST]
            AllowedOrigins: !If
              - IsDev
              - !If
                - HasAllowedOrigin
                - [!Ref AllowedOrigin, 'http://localhost:5173']
                - ['http://localhost:5173']
              - [!Ref AllowedOrigin]
            AllowedHeaders: ['*']
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          # Backstop for deleting team photos after the event (cleanup script does it first).
          - Id: expire-team-photos
            Status: Enabled
            Prefix: teams/
            ExpirationInDays: 30

  # Handlers are pre-bundled by `npm run build` (scripts/build.ts) into dist/<group>-<name>/.
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/public-health
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE

  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${HealthFunction}
      RetentionInDays: 14

  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/public-register
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /teams
            Method: POST
            Auth:
              Authorizer: NONE
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminDeleteUser
              Resource: !GetAtt UserPool.Arn
            - Effect: Allow
              Action: [dynamodb:UpdateItem, dynamodb:PutItem]
              Resource: !GetAtt GameTable.Arn

  RegisterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${RegisterFunction}
      RetentionInDays: 14

  TeamPhotoUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/team-photo-upload
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /teams/me/photo-upload
            Method: POST
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt GameTable.Arn
            # Signs the pre-signed POST; the browser does the upload.
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${AssetsBucket.Arn}/teams/*

  TeamPhotoUploadLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TeamPhotoUploadFunction}
      RetentionInDays: 14

  TeamPhotoConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/team-photo-confirm
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /teams/me/photo-confirm
            Method: POST
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt GameTable.Arn
            # HeadObject and the pre-signed view URL.
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${AssetsBucket.Arn}/teams/*

  TeamPhotoConfirmLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TeamPhotoConfirmFunction}
      RetentionInDays: 14

  TeamStateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/team-state
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /teams/me/state
            Method: GET
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource: !GetAtt GameTable.Arn
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt ContentTable.Arn
            # Pre-signed view URLs for the team photo and content images.
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub ${AssetsBucket.Arn}/teams/*
                - !Sub ${AssetsBucket.Arn}/content/*

  TeamStateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TeamStateFunction}
      RetentionInDays: 14

  TeamRevealFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/team-reveal
      Events:
        Call:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /teams/me/current/reveal
            Method: POST
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem]
              Resource: !GetAtt GameTable.Arn
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt ContentTable.Arn
            # Pre-signed view URLs for the team photo and content images.
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub ${AssetsBucket.Arn}/teams/*
                - !Sub ${AssetsBucket.Arn}/content/*

  TeamRevealLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TeamRevealFunction}
      RetentionInDays: 14

  TeamAnswerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/team-answer
      Events:
        Call:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /teams/me/current/answer
            Method: POST
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt GameTable.Arn
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt ContentTable.Arn
            # Pre-signed view URLs for the team photo and content images.
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub ${AssetsBucket.Arn}/teams/*
                - !Sub ${AssetsBucket.Arn}/content/*

  TeamAnswerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TeamAnswerFunction}
      RetentionInDays: 14

  AdminStartGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/admin-start-game
      Events:
        Call:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/game/start
            Method: POST
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:UpdateItem, dynamodb:Scan, dynamodb:PutItem]
              Resource: !GetAtt GameTable.Arn
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt ContentTable.Arn

  AdminStartGameLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AdminStartGameFunction}
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  Region:
    Value: !Ref AWS::Region
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ContentTable:
    Value: !Ref ContentTable
  GameTable:
    Value: !Ref GameTable
  AssetsBucket:
    Value: !Ref AssetsBucket
