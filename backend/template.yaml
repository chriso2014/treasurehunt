AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hitchin Treasure Hunt backend (HTTP API, Lambdas, DynamoDB, assets bucket)

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
  AllowedOrigin:
    Type: String
    Default: ''
    Description: Frontend CloudFront URL for CORS (set after the first frontend deploy)

Conditions:
  IsDev: !Equals [!Ref Env, dev]
  HasAllowedOrigin: !Not [!Equals [!Ref AllowedOrigin, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Handler: index.handler
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        ENV: !Ref Env
        NODE_OPTIONS: --enable-source-maps

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # SAM drops the rest of CorsConfiguration if AllowOrigins is an !If, so each branch
      # carries the full config.
      CorsConfiguration: !If
        - IsDev
        - AllowOrigins: !If
            - HasAllowedOrigin
            - [!Ref AllowedOrigin, 'http://localhost:5173']
            - ['http://localhost:5173']
          AllowMethods: [GET, POST, OPTIONS]
          AllowHeaders: [authorization, content-type]
          MaxAge: 600
        - AllowOrigins: [!Ref AllowedOrigin]
          AllowMethods: [GET, POST, OPTIONS]
          AllowHeaders: [authorization, content-type]
          MaxAge: 600

  # Game content, loaded by `npm run seed`; read-only to the game Lambdas (docs/04-data-model.md).
  ContentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # Game state: game, team profiles, stages, attempts. GSI1 is the sparse pending-review queue.
  GameTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # Private bucket for content images (content/) and team photos (teams/), via pre-signed URLs only.
  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, POST]
            AllowedOrigins: !If
              - IsDev
              - !If
                - HasAllowedOrigin
                - [!Ref AllowedOrigin, 'http://localhost:5173']
                - ['http://localhost:5173']
              - [!Ref AllowedOrigin]
            AllowedHeaders: ['*']
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          # Backstop for deleting team photos after the event (cleanup script does it first).
          - Id: expire-team-photos
            Status: Enabled
            Prefix: teams/
            ExpirationInDays: 30

  # Handlers are pre-bundled by `npm run build` (scripts/build.ts) into dist/<group>-<name>/.
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/public-health
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET

  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${HealthFunction}
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  Region:
    Value: !Ref AWS::Region
  ContentTable:
    Value: !Ref ContentTable
  GameTable:
    Value: !Ref GameTable
  AssetsBucket:
    Value: !Ref AssetsBucket
